services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boburmirzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-87654321}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-boburmirzo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-87654321}
      DB_NAME: ${POSTGRES_DB:-blog}
      DB_SYNCHRONIZE: 'false'
    ports:
      # Only reachable from the server itself; the public goes through nginx.
      - '127.0.0.1:${API_PORT:-3006}:3000'

volumes:
  pgdata:
